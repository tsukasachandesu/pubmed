[project]
name = "pubmed"
version = "0.1.0"
description = "CLI tool for PubMed search, metadata collection, and PDF downloads."
authors = [{name = "PubMed Team"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer[all]>=0.12",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "anyio>=4.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "tenacity>=8.2",
  "structlog>=24.1",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp>=1.25",
]

[project.scripts]
pubmed = "pubmed.presentation.cli.app:run"

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
warn_unused_ignores = true
plugins = []

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
